<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>HM01B0 Live Snapshot</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
    img { max-width: 90vw; margin-top: 20px; border: 2px solid #444; image-rendering: pixelated; }
    #status { color: #888; font-size: 0.9em; margin-top: 10px; }
    button {
      margin-top: 16px;
      padding: 10px 24px;
      font-size: 1em;
      border-radius: 8px;
      border: none;
      background: #3a7;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #555; cursor: default; }
  </style>
</head>
<body>
  <h1>HM01B0 카메라</h1>
  <img id="cam" src="images/latest.bmp" alt="latest capture">
  <p id="status">마지막으로 저장된 사진입니다. 버튼을 누르면 지금 찍습니다.</p>
  <button id="shootBtn">사진보기 (지금 촬영)</button>

  <script>
    // ⚠️ Pico는 집 공유기 뒤에 있어 밖에서 직접 접속할 수 없으므로,
    // ntfy.sh(무료 공개 중계 서비스)를 거쳐 "촬영해줘" 신호를 보내고
    // "촬영 끝났어" 신호를 받습니다. github_upload.py의 NTFY_TOPIC과
    // 아래 값이 정확히 같아야 합니다. 아무도 못 맞출 랜덤 문자열로 바꾸세요.
    const NTFY_TOPIC = "hm01b0-jinsu-cam-8271kd93";
    const NTFY_URL = "https://ntfy.sh/" + NTFY_TOPIC;

    // Pico 폴링 주기 + 촬영/업로드/GitHub Pages 재배포 시간을 감안한 타임아웃
    const RESPONSE_TIMEOUT_MS = 45000;

    const img = document.getElementById('cam');
    const status = document.getElementById('status');
    const btn = document.getElementById('shootBtn');

    let sse = null;
    let timeoutHandle = null;

    function setStatus(text) {
      status.textContent = text;
    }

    function cleanup() {
      if (sse) { sse.close(); sse = null; }
      if (timeoutHandle) { clearTimeout(timeoutHandle); timeoutHandle = null; }
      btn.disabled = false;
    }

    function refreshImage() {
      img.src = 'images/latest.bmp?t=' + Date.now();
    }

    async function requestCapture() {
      btn.disabled = true;
      setStatus('카메라에 촬영 요청을 보내는 중...');

      // 1) 완료 신호를 먼저 구독 시작 (요청 전에 걸어둬야 놓치지 않음)
      sse = new EventSource(NTFY_URL + '/sse');
      sse.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.event === 'message' && data.message === 'capture_done') {
            setStatus('새 사진을 받아오는 중...');
            refreshImage();
            setStatus('완료: ' + new Date().toLocaleTimeString());
            cleanup();
          }
        } catch (err) {
          // 무시하고 다음 이벤트 대기
        }
      };
      sse.onerror = () => {
        // 연결이 끊기면 조용히 재시도하도록 두되, 타임아웃이 최종 안전장치 역할
      };

      timeoutHandle = setTimeout(() => {
        setStatus('응답이 없습니다. 카메라가 꺼져있거나 네트워크 문제일 수 있어요. 다시 시도해보세요.');
        cleanup();
      }, RESPONSE_TIMEOUT_MS);

      // 2) 촬영 요청 발행
      try {
        await fetch(NTFY_URL, {
          method: 'POST',
          body: 'capture_request',
        });
        setStatus('요청 전송됨. 카메라가 촬영하고 업로드할 때까지 잠시 기다려주세요 (약 10~20초)...');
      } catch (err) {
        setStatus('요청 전송 실패: ' + err.message);
        cleanup();
      }
    }

    btn.addEventListener('click', requestCapture);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>HM01B0 Live Snapshot</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
    img { max-width: 90vw; margin-top: 20px; border: 2px solid #444; image-rendering: pixelated; }
    #status { color: #888; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>HM01B0 카메라 최신 사진</h1>
  <img id="cam" src="images/latest.bmp" alt="latest capture">
  <p id="status">마지막 갱신: -</p>

  <script>
    // images/latest.bmp 자체는 Pico가 30초 주기로 덮어쓰므로,
    // 브라우저 캐시를 피하기 위해 쿼리스트링에 타임스탬프를 붙여 계속 새로 불러온다.
    const REFRESH_MS = 30000; // Pico의 UPLOAD_INTERVAL_SEC과 맞추면 됨

    function refreshImage() {
      const img = document.getElementById('cam');
      img.src = 'images/latest.bmp?t=' + Date.now();
      document.getElementById('status').textContent =
        '마지막 갱신 시도: ' + new Date().toLocaleTimeString();
    }

    setInterval(refreshImage, REFRESH_MS);
  </script>
</body>
</html>
